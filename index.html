<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="30일 신약통독" />
  <title>30일 신약통독 체크표</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --success: #059669;
      --success-bg: #ecfdf5;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 48px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(30, 58, 138, 0.2);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header-top h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      display: block;
    }
    .stat-label {
      font-size: 0.72rem;
      opacity: 0.88;
    }
    .progress-wrap {
      background: rgba(255, 255, 255, 0.22);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #34d399;
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-next {
      flex: 1;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      box-shadow: var(--shadow);
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-reset {
      background: var(--surface);
      color: var(--text-sub);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .filters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar {
      display: none;
    }
    .chip {
      background: var(--surface);
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .card.done {
      background: var(--success-bg);
      border-color: #a7f3d0;
    }
    .card.highlight {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .check-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #ffffff;
      transition: all 0.2s ease;
    }
    .card.done .check-circle {
      background: var(--success);
      border-color: var(--success);
    }
    .check-circle svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.2s ease;
    }
    .card.done .check-circle svg {
      opacity: 1;
      transform: scale(1);
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .day-tag {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card.done .day-tag {
      color: var(--success);
      background: #d1fae5;
    }
    .chap-count {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .reading-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: keep-all;
    }
    .card.done .reading-title {
      color: #065f46;
      text-decoration: line-through;
      text-decoration-color: rgba(6, 95, 70, 0.45);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      background: var(--surface);
      border-radius: 16px;
      border: 1px dashed var(--border);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>30일 신약통독 체크표</h1>
        <span class="badge">총 260장</span>
      </div>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-value" id="stat-percent">0%</span>
          <span class="stat-label">달성률</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="stat-days">0/30</span>
          <span class="stat-label">완료 일수</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="stat-read">0</span>
          <span class="stat-label">읽은 장수</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="stat-remain">260</span>
          <span class="stat-label">남은 장수</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </header>

    <div class="action-bar">
      <button class="btn btn-next" id="btn-next" type="button">
        <span id="next-label">다음 읽을 말씀: Day 1</span>
        <span>이동 →</span>
      </button>
      <button class="btn btn-reset" id="btn-reset" type="button">초기화</button>
    </div>

    <div class="filters">
      <div class="filter-row" id="week-filters">
        <button class="chip active" data-week="all">전체 (30일)</button>
        <button class="chip" data-week="1">1주차 (1-7일)</button>
        <button class="chip" data-week="2">2주차 (8-14일)</button>
        <button class="chip" data-week="3">3주차 (15-21일)</button>
        <button class="chip" data-week="4">4주차 (22-28일)</button>
        <button class="chip" data-week="5">5주차 (29-30일)</button>
      </div>
      <div class="filter-row" id="status-filters">
        <button class="chip active" data-status="all">모두 보기</button>
        <button class="chip" data-status="unread">미완료만</button>
        <button class="chip" data-status="done">완료만</button>
      </div>
    </div>

    <main class="list" id="reading-list"></main>
  </div>

  <script>
    const PLAN = [{"day": 1, "week": 1, "reading": "마태복음 1-9장", "chapters": 9}, {"day": 2, "week": 1, "reading": "마태복음 10-18장", "chapters": 9}, {"day": 3, "week": 1, "reading": "마태복음 19-28장", "chapters": 10}, {"day": 4, "week": 1, "reading": "마가복음 1-8장", "chapters": 8}, {"day": 5, "week": 1, "reading": "마가복음 9-16장", "chapters": 8}, {"day": 6, "week": 1, "reading": "누가복음 1-8장", "chapters": 8}, {"day": 7, "week": 1, "reading": "누가복음 9-16장", "chapters": 8}, {"day": 8, "week": 2, "reading": "누가복음 17-24장", "chapters": 8}, {"day": 9, "week": 2, "reading": "요한복음 1-7장", "chapters": 7}, {"day": 10, "week": 2, "reading": "요한복음 8-14장", "chapters": 7}, {"day": 11, "week": 2, "reading": "요한복음 15-21장", "chapters": 7}, {"day": 12, "week": 2, "reading": "사도행전 1-9장", "chapters": 9}, {"day": 13, "week": 2, "reading": "사도행전 10-18장", "chapters": 9}, {"day": 14, "week": 2, "reading": "사도행전 19-28장", "chapters": 10}, {"day": 15, "week": 3, "reading": "로마서 1-8장", "chapters": 8}, {"day": 16, "week": 3, "reading": "로마서 9-16장", "chapters": 8}, {"day": 17, "week": 3, "reading": "고린도전서 1-8장", "chapters": 8}, {"day": 18, "week": 3, "reading": "고린도전서 9-16장", "chapters": 8}, {"day": 19, "week": 3, "reading": "고린도후서 1-13장", "chapters": 13}, {"day": 20, "week": 3, "reading": "갈라디아서 1-6장, 에베소서 1-6장", "chapters": 12}, {"day": 21, "week": 3, "reading": "빌립보서 1-4장, 골로새서 1-4장", "chapters": 8}, {"day": 22, "week": 4, "reading": "데살로니가전서 1-5장, 데살로니가후서 1-3장", "chapters": 8}, {"day": 23, "week": 4, "reading": "디모데전서 1-6장, 디모데후서 1-4장", "chapters": 10}, {"day": 24, "week": 4, "reading": "디도서 1-3장, 빌레몬서 1장, 히브리서 1-6장", "chapters": 10}, {"day": 25, "week": 4, "reading": "히브리서 7-13장", "chapters": 7}, {"day": 26, "week": 4, "reading": "야고보서 1-5장, 베드로전서 1-5장", "chapters": 10}, {"day": 27, "week": 4, "reading": "베드로후서 1-3장, 요한일서 1-5장", "chapters": 8}, {"day": 28, "week": 4, "reading": "요한이서 1장, 요한삼서 1장, 유다서 1장, 요한계시록 1-7장", "chapters": 10}, {"day": 29, "week": 5, "reading": "요한계시록 8-15장", "chapters": 8}, {"day": 30, "week": 5, "reading": "요한계시록 16-22장", "chapters": 7}];
    const STORAGE_KEY = 'nt_reading_30days_v1';

    let completedDays = new Set();
    let currentWeek = 'all';
    let currentStatus = 'all';

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          completedDays = new Set(JSON.parse(saved));
        }
      } catch (e) {
        console.error(e);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedDays]));
      } catch (e) {
        console.error(e);
      }
    }

    function updateDashboard() {
      const totalChapters = 260;
      let readChapters = 0;
      PLAN.forEach(item => {
        if (completedDays.has(item.day)) {
          readChapters += item.chapters;
        }
      });

      const doneCount = completedDays.size;
      const remainChapters = totalChapters - readChapters;
      const percent = Math.round((readChapters / totalChapters) * 100);

      document.getElementById('stat-percent').textContent = percent + '%';
      document.getElementById('stat-days').textContent = doneCount + '/30';
      document.getElementById('stat-read').textContent = readChapters;
      document.getElementById('stat-remain').textContent = remainChapters;
      document.getElementById('progress-bar').style.width = percent + '%';

      const nextItem = PLAN.find(item => !completedDays.has(item.day));
      const nextLabel = document.getElementById('next-label');
      if (nextItem) {
        nextLabel.textContent = `다음 말씀: Day ${nextItem.day} (${nextItem.reading})`;
      } else {
        nextLabel.textContent = '신약 30일 통독을 모두 완료했습니다!';
      }
    }

    function renderList() {
      const listEl = document.getElementById('reading-list');
      listEl.innerHTML = '';

      const filtered = PLAN.filter(item => {
        const matchWeek = currentWeek === 'all' || String(item.week) === currentWeek;
        const isDone = completedDays.has(item.day);
        const matchStatus =
          currentStatus === 'all' ||
          (currentStatus === 'done' && isDone) ||
          (currentStatus === 'unread' && !isDone);
        return matchWeek && matchStatus;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">조건에 해당하는 통독 일정이 없습니다.</div>';
        return;
      }

      filtered.forEach(item => {
        const isDone = completedDays.has(item.day);
        const card = document.createElement('div');
        card.className = 'card' + (isDone ? ' done' : '');
        card.id = 'day-card-' + item.day;
        card.innerHTML = `
          <div class="check-circle">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="day-tag">Day ${item.day}</span>
              <span class="chap-count">${item.week}주차 · ${item.chapters}장</span>
            </div>
            <div class="reading-title">${item.reading}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          if (completedDays.has(item.day)) {
            completedDays.delete(item.day);
          } else {
            completedDays.add(item.day);
          }
          saveProgress();
          updateDashboard();
          renderList();
        });
        listEl.appendChild(card);
      });
    }

    document.getElementById('week-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('#week-filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentWeek = btn.dataset.week;
      renderList();
    });

    document.getElementById('status-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('#status-filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.dataset.status;
      renderList();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      const nextItem = PLAN.find(item => !completedDays.has(item.day));
      if (!nextItem) return;

      currentWeek = 'all';
      currentStatus = 'all';
      document.querySelectorAll('#week-filters .chip').forEach(c => {
        c.classList.toggle('active', c.dataset.week === 'all');
      });
      document.querySelectorAll('#status-filters .chip').forEach(c => {
        c.classList.toggle('active', c.dataset.status === 'all');
      });
      renderList();

      const target = document.getElementById('day-card-' + nextItem.day);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('highlight');
        setTimeout(() => target.classList.remove('highlight'), 1400);
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (completedDays.size === 0) return;
      if (confirm('모든 통독 체크 기록을 초기화할까요?')) {
        completedDays.clear();
        saveProgress();
        updateDashboard();
        renderList();
      }
    });

    loadProgress();
    updateDashboard();
    renderList();
  </script>
</body>
</html>
